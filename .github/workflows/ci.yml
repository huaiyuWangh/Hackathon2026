name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub 托管 runner：本项目无私有依赖，不需要自建机器
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # cgo 音频链路（internal/linx/audio.go）链接 portaudio/libopus/opusfile
      # tmux 供 ccrunner 测试（无会话时的错误路径），claude CLI 不装——缺依赖分支有 skip 守卫
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            portaudio19-dev libopus-dev libopusfile-dev tmux

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## 测试覆盖率"
            echo '```'
            go tool cover -func=coverage.txt | tail -n +1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
          retention-days: 14

      # 公开仓库可无 token 上传 codecov；失败不阻断 CI（badge 稍后自然生效）
      - name: Upload to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            portaudio19-dev libopus-dev libopusfile-dev

      # 版本与本地开发环境一致（v2.1.6），规则见 .golangci.yml
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6

      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
