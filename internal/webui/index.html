<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MacCC 语音控制</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:28px;
       background:#111;color:#eee;font-family:-apple-system,"PingFang SC",sans-serif}
  #btn{width:170px;height:170px;border-radius:50%;border:none;font-size:19px;cursor:pointer;
       background:#333;color:#aaa;transition:background .2s}
  #btn.on{background:#e5484d;color:#fff;animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.35)}
                   70%{box-shadow:0 0 0 30px rgba(229,72,77,0)}
                   100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
  #state{font-size:15px;color:#888}
</style>
</head>
<body>
  <button id="btn">开启麦克风</button>
  <div id="state">麦克风已关闭</div>
<script>
const btn = document.getElementById('btn'), state = document.getElementById('state');
function render(on){
  btn.classList.toggle('on', on);
  btn.textContent = on ? '关闭麦克风' : '开启麦克风';
  state.textContent = on ? '聆听中 · 对着 Mac 说话即可' : '麦克风已关闭';
}
async function sync(){
  try { const s = await (await fetch('/api/status')).json(); render(s.micOn); }
  catch(e){ state.textContent = '服务未连接'; }
}
btn.onclick = async () => {
  try { const s = await (await fetch('/api/mic', {method:'POST'})).json(); render(s.micOn); }
  catch(e){ state.textContent = '操作失败'; }
};
sync();
</script>
</body>
</html>
